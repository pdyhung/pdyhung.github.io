<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Ca đoàn Các Thánh Tử Đạo Việt Nam">
  <defs>
    <path id="top" d="M 32 120 A 88 88 0 0 1 208 120"/>
    <path id="bottom" d="M 26 120 A 94 94 0 0 0 214 120"/>
  </defs>
  <circle cx="120" cy="120" r="116" fill="#7a1420"/>
  <circle cx="120" cy="120" r="108" fill="none" stroke="#e9c46a" stroke-width="2"/>
  <circle cx="120" cy="120" r="68" fill="#fdf6e3" stroke="#e9c46a" stroke-width="3"/>
  <text font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="15" font-weight="700" fill="#fdf6e3" letter-spacing="1.5">
    <textPath href="#top" startOffset="50%" text-anchor="middle">CA ĐOÀN CÁC THÁNH</textPath>
  </text>
  <text font-family="'Be Vietnam Pro', Arial, sans-serif" font-size="15" font-weight="700" fill="#fdf6e3" letter-spacing="1.5">
    <textPath href="#bottom" startOffset="50%" text-anchor="middle" dominant-baseline="hanging">TỬ ĐẠO VIỆT NAM</textPath>
  </text>
  <circle cx="30" cy="120" r="3" fill="#e9c46a"/>
  <circle cx="210" cy="120" r="3" fill="#e9c46a"/>
