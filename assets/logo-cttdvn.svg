    <ellipse cx="84" cy="138" rx="9" ry="3.2" transform="rotate(-25 84 138)"/>
    <ellipse cx="91" cy="152" rx="9" ry="3.2" transform="rotate(-15 91 152)"/>
    <ellipse cx="160" cy="124" rx="9" ry="3.2" transform="rotate(35 160 124)"/>
    <ellipse cx="156" cy="138" rx="9" ry="3.2" transform="rotate(25 156 138)"/>
    <ellipse cx="149" cy="152" rx="9" ry="3.2" transform="rotate(15 149 152)"/>
