<text x="20" y="30" font-weight="bold">(a) Nhà xưởng Hòa Bình – nhánh TCVN: một nhịp, chân cột khớp</text><line x1="40" y1="215" x2="720" y2="215" stroke="#888" stroke-width="1"/><polyline points="80,215 80,130.16 380,109.2 680,130.16 680,215" fill="none" stroke="#222" stroke-width="3"/><path d="M80,215 l-9,14 h18 z" fill="#fff" stroke="#222" stroke-width="1.4"/><line x1="66" y1="229" x2="94" y2="229" stroke="#222" stroke-width="1.4"/><line x1="68" y1="229" x2="63" y2="235" stroke="#222" stroke-width="1"/><line x1="75" y1="229" x2="70" y2="235" stroke="#222" stroke-width="1"/><line x1="82" y1="229" x2="77" y2="235" stroke="#222" stroke-width="1"/><line x1="89" y1="229" x2="84" y2="235" stroke="#222" stroke-width="1"/><path d="M680,215 l-9,14 h18 z" fill="#fff" stroke="#222" stroke-width="1.4"/><line x1="666" y1="229" x2="694" y2="229" stroke="#222" stroke-width="1.4"/><line x1="668" y1="229" x2="663" y2="235" stroke="#222" stroke-width="1"/><line x1="675" y1="229" x2="670" y2="235" stroke="#222" stroke-width="1"/><line x1="682" y1="229" x2="677" y2="235" stroke="#222" stroke-width="1"/><line x1="689" y1="229" x2="684" y2="235" stroke="#222" stroke-width="1"/><line x1="80" y1="263" x2="680" y2="263" stroke="#222" stroke-width="1" marker-start="url(#mk)" marker-end="url(#mk)"/><line x1="80" y1="257" x2="80" y2="269" stroke="#222" stroke-width="1"/><line x1="680" y1="257" x2="680" y2="269" stroke="#222" stroke-width="1"/><text x="380" y="257" text-anchor="middle">Nhịp L = 50 m (8 × 6,25 m)</text><line x1="50" y1="215" x2="50" y2="130.2" stroke="#222" stroke-width="1" marker-start="url(#mk)" marker-end="url(#mk)"/><line x1="44" y1="215" x2="56" y2="215" stroke="#222" stroke-width="1"/><line x1="44" y1="130.2" x2="56" y2="130.2" stroke="#222" stroke-width="1"/><text x="44" y="176.6" text-anchor="end">7,07 m</text><text x="44" y="192.6" text-anchor="end" font-size="12">đỉnh cột</text><line x1="380" y1="109.2" x2="380" y2="215" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/><line x1="410" y1="215" x2="410" y2="109.2" stroke="#222" stroke-width="1" marker-start="url(#mk)" marker-end="url(#mk)"/><line x1="404" y1="215" x2="416" y2="215" stroke="#222" stroke-width="1"/><line x1="404" y1="109.2" x2="416" y2="109.2" stroke="#222" stroke-width="1"/><text x="416" y="166.1" text-anchor="start">đỉnh mái 8,82 m</text><text x="230" y="107.7" text-anchor="middle" font-weight="bold" fill="#1f5fa8" transform="rotate(-4 230 107.7)">i = 7 %</text><text x="530" y="107.7" text-anchor="middle" font-weight="bold" fill="#1f5fa8" transform="rotate(4 530 107.7)">i = 7 %</text><text x="20" y="50" font-size="12" fill="#555">Thông thủy 6,5 m; dài nhà 72 m</text><text x="20" y="285" font-weight="bold">(b) Nhà máy Đức Nhuận Phát (DNP) – nhánh Mỹ: có cầu trục</text><line x1="30" y1="470" x2="731" y2="470" stroke="#888" stroke-width="1"/><polyline points="70,470 70,366.5 380.5,335.5 691,366.5 691,470" fill="none" stroke="#222" stroke-width="3"/><line x1="60" y1="470" x2="80" y2="470" stroke="#222" stroke-width="3"/><line x1="681" y1="470" x2="701" y2="470" stroke="#222" stroke-width="3"/><line x1="70" y1="502" x2="691" y2="502" stroke="#222" stroke-width="1" marker-start="url(#mk)" marker-end="url(#mk)"/><line x1="70" y1="496" x2="70" y2="508" stroke="#222" stroke-width="1"/><line x1="691" y1="496" x2="691" y2="508" stroke="#222" stroke-width="1"/><text x="380.5" y="496" text-anchor="middle">Nhịp L = 54 m</text><line x1="45" y1="470" x2="45" y2="366.5" stroke="#222" stroke-width="1" marker-start="url(#mk)" marker-end="url(#mk)"/><line x1="39" y1="470" x2="51" y2="470" stroke="#222" stroke-width="1"/><line x1="39" y1="366.5" x2="51" y2="366.5" stroke="#222" stroke-width="1"/><text x="39" y="422.3" text-anchor="end">9 m</text><line x1="380.5" y1="335.5" x2="380.5" y2="470" stroke="#888" stroke-width="1" stroke-dasharray="4 3"/><line x1="410.5" y1="470" x2="410.5" y2="335.5" stroke="#222" stroke-width="1" marker-start="url(#mk)" marker-end="url(#mk)"/><line x1="404.5" y1="470" x2="416.5" y2="470" stroke="#222" stroke-width="1"/><line x1="404.5" y1="335.5" x2="416.5" y2="335.5" stroke="#222" stroke-width="1"/><text x="416.5" y="406.7" text-anchor="start">≈ 11,7 m (= 9 + 27 × 0,10)</text><text x="225.3" y="339" text-anchor="middle" font-weight="bold" fill="#1f5fa8" transform="rotate(-5.7 225.3 339)">i = 10 %</text><text x="535.8" y="339" text-anchor="middle" font-weight="bold" fill="#1f5fa8" transform="rotate(5.7 535.8 339)">i = 10 %</text><text x="20" y="305" font-size="12" fill="#555">Dài nhà 60 m; cầu trục, động đất, 8 trường hợp gió</text><text x="740" y="530" text-anchor="end" font-size="12" fill="#777">Vẽ cùng tỷ lệ đứng và ngang; cao độ đỉnh mái DNP suy ra từ nhịp và độ dốc.</text></svg>
