<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="sans-serif" font-size="13" fill="#222">
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker></defs>
<rect width="780" height="420" fill="#fff"/>
<text x="20" y="28" font-weight="bold">Trục địa phương mặc định của cột và kèo trong mặt phẳng khung</text><polyline points="80,320 80,130 440,90" fill="none" stroke="#222" stroke-width="3"/><path d="M80,320 l-9,14 h18 z" fill="#fff" stroke="#222" stroke-width="1.4"/><line x1="66" y1="334" x2="94" y2="334" stroke="#222" stroke-width="1.4"/><line x1="68" y1="334" x2="63" y2="340" stroke="#222" stroke-width="1"/><line x1="75" y1="334" x2="70" y2="340" stroke="#222" stroke-width="1"/><line x1="82" y1="334" x2="77" y2="340" stroke="#222" stroke-width="1"/><line x1="89" y1="334" x2="84" y2="340" stroke="#222" stroke-width="1"/><line x1="440" y1="90" x2="480" y2="95" stroke="#222" stroke-width="3" stroke-dasharray="6 4"/><circle cx="80" cy="320" r="4" fill="#222"/><circle cx="80" cy="130" r="4" fill="#222"/><circle cx="440" cy="90" r="4" fill="#222"/><text x="68" y="314" text-anchor="end" font-weight="bold">I</text><text x="68" y="148" text-anchor="end" font-weight="bold">J</text><text x="84" y="118" font-weight="bold">I</text><text x="440" y="78" text-anchor="middle" font-weight="bold">J</text><line x1="80" y1="225" x2="80" y2="170" stroke="#c0392b" stroke-width="2" marker-end="url(#mr)"/><text x="80" y="161.3" text-anchor="middle" font-weight="bold" fill="#c0392b">1</text><line x1="80" y1="225" x2="135" y2="225" stroke="#2e7d32" stroke-width="2" marker-end="url(#mg)"/><text x="148.8" y="230" text-anchor="middle" font-weight="bold" fill="#2e7d32">2</text><circle cx="58" cy="247" r="7" fill="#fff" stroke="#1f5fa8" stroke-width="2"/><circle cx="58" cy="247" r="2.2" fill="#1f5fa8"/><text x="70" y="241" font-weight="bold" fill="#1f5fa8">3</text><text x="94" y="265" font-size="12">cột: 1 hướng lên (I → J)</text><line x1="260" y1="110" x2="314.7" y2="103.9" stroke="#c0392b" stroke-width="2" marker-end="url(#mr)"/><text x="328.3" y="107.4" text-anchor="middle" font-weight="bold" fill="#c0392b">1</text><line x1="260" y1="110" x2="253.9" y2="55.3" stroke="#2e7d32" stroke-width="2" marker-end="url(#mg)"/><text x="252.4" y="46.7" text-anchor="middle" font-weight="bold" fill="#2e7d32">2</text><circle cx="240" cy="142" r="7" fill="#fff" stroke="#1f5fa8" stroke-width="2"/><circle cx="240" cy="142" r="2.2" fill="#1f5fa8"/><text x="252" y="136" font-weight="bold" fill="#1f5fa8">3</text><text x="280" y="150" font-size="12">kèo: 1 theo I → J; 2 vuông góc, hướng lên</text><text x="260" y="260" font-size="12" fill="#1f5fa8">3 = 1 × 2: vuông góc mặt phẳng khung</text><text x="260" y="278" font-size="12" fill="#555">(chấm tròn: trục hướng ra phía người xem)</text><text x="640" y="50" text-anchor="middle" font-weight="bold">Tiết diện I (nhìn dọc trục 1)</text><path d="M585,95 h110 v12 h-51.5 v126 h51.5 v12 h-110 v-12 h51.5 v-126 h-51.5 z" fill="#ddd" stroke="#222" stroke-width="1.5"/><line x1="640" y1="170" x2="640" y2="67" stroke="#2e7d32" stroke-width="2" marker-end="url(#mg)"/><text x="648" y="73" font-weight="bold" fill="#2e7d32">2</text><line x1="640" y1="170" x2="725" y2="170" stroke="#1f5fa8" stroke-width="2" marker-end="url(#mb)"/><text x="729" y="175" font-weight="bold" fill="#1f5fa8">3</text><line x1="555" y1="170" x2="581" y2="170" stroke="#1f5fa8" stroke-width="1" stroke-dasharray="5 3"/><text x="551" y="175" text-anchor="end" fill="#1f5fa8">3</text><text x="640" y="269" text-anchor="middle" font-size="12">trục 3–3 = trục chính (song song cánh)</text><text x="640" y="287" text-anchor="middle" font-size="12" font-weight="bold">M3: uốn trong mặt phẳng khung</text><text x="640" y="305" text-anchor="middle" font-size="12" fill="#c0392b">cánh bị xoay 90° → Local Axes, Angle = 90</text><circle cx="640" cy="95" r="4" fill="#c0392b"/><text x="630" y="89" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">8</text><circle cx="640" cy="170" r="4" fill="#222"/><text x="630" y="162" text-anchor="end" font-size="12" font-weight="bold">10</text><text x="770" y="400" text-anchor="end" font-size="12" fill="#555">Cardinal Point (điểm đặt): 10 = trọng tâm (mặc định), 8 = giữa cánh trên</text></svg>
