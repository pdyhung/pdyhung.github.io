<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="sans-serif" font-size="12">
<rect width="660" height="420" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
<marker id="dm" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs>
<!-- nền, móng -->
<line x1="40" y1="370" x2="600" y2="370" stroke="#333" stroke-width="1.5"/>
<path d="M40 370h560" stroke="#777" stroke-width="6" stroke-dasharray="2 6" opacity=".4"/>
<rect x="92" y="370" width="56" height="22" fill="#ddd" stroke="#333"/><rect x="492" y="370" width="56" height="22" fill="#ddd" stroke="#333"/>
<!-- cột trái: phần dưới rộng, phần trên hẹp -->
<rect x="104" y="190" width="32" height="180" fill="#cfd8dc" stroke="#333"/>
<rect x="104" y="80" width="16" height="110" fill="#cfd8dc" stroke="#333"/>
<!-- vai cột trái -->
<path d="M136 190h22v-14h-22z" fill="#b0bec5" stroke="#333"/>
<!-- cột phải -->
<rect x="504" y="190" width="32" height="180" fill="#cfd8dc" stroke="#333"/>
<rect x="520" y="80" width="16" height="110" fill="#cfd8dc" stroke="#333"/>
<path d="M504 190h-22v-14h22z" fill="#b0bec5" stroke="#333"/>
<!-- kèo -->
<path d="M104 80L320 50L536 80" fill="none" stroke="#333" stroke-width="6" stroke-linejoin="round"/>
<!-- dầm cầu trục + ray -->
<rect x="140" y="156" width="20" height="20" fill="#90a4ae" stroke="#333"/><rect x="146" y="150" width="8" height="6" fill="#333"/>
<rect x="480" y="156" width="20" height="20" fill="#90a4ae" stroke="#333"/><rect x="486" y="150" width="8" height="6" fill="#333"/>
<!-- cầu trục: dầm cầu + bánh -->
<circle cx="150" cy="144" r="6" fill="#fff" stroke="#333"/><circle cx="490" cy="144" r="6" fill="#fff" stroke="#333"/>
<rect x="140" y="118" width="360" height="20" fill="#ffe082" stroke="#333"/>
<text x="320" y="132" text-anchor="middle">Cầu trục (dầm cầu)</text>
<!-- xe con sát bên trái -->
<rect x="176" y="100" width="58" height="18" fill="#ffca28" stroke="#333"/><text x="205" y="96" text-anchor="middle">xe con G</text>
<line x1="205" y1="118" x2="205" y2="226" stroke="#333"/><path d="M199 226q6 12 12 0" fill="none" stroke="#333" stroke-width="2"/>
<rect x="190" y="236" width="30" height="22" fill="#eee" stroke="#333"/><text x="205" y="251" text-anchor="middle">Q</text>
<!-- tải lên khung -->
<line x1="150" y1="198" x2="150" y2="240" stroke="#c62828" stroke-width="2" marker-end="url(#ar)"/>
<text x="156" y="236" fill="#c62828" font-weight="bold">Dmax</text>
<line x1="490" y1="198" x2="490" y2="240" stroke="#c62828" stroke-width="2" marker-end="url(#ar)"/>
<text x="440" y="236" fill="#c62828" font-weight="bold">Dmin</text>
<line x1="76" y1="150" x2="102" y2="150" stroke="#c62828" stroke-width="2" marker-end="url(#ar)"/>
<text x="46" y="146" fill="#c62828" font-weight="bold">T</text>
<line x1="564" y1="150" x2="538" y2="150" stroke="#c62828" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="4 3"/>
<text x="568" y="146" fill="#c62828">T (đổi chiều)</text>
<!-- lệch tâm e -->
<line x1="120" y1="290" x2="120" y2="300" stroke="#333"/><line x1="150" y1="250" x2="150" y2="300" stroke="#333" stroke-dasharray="3 2"/>
<line x1="120" y1="296" x2="150" y2="296" stroke="#333" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="135" y="312" text-anchor="middle">e</text>
<line x1="120" y1="190" x2="120" y2="370" stroke="#333" stroke-dasharray="8 3 2 3" opacity=".6"/>
<text x="98" y="335" text-anchor="end">trục cột dưới</text>
<!-- cao trình ray h -->
<line x1="580" y1="370" x2="580" y2="150" stroke="#333" marker-start="url(#dm)" marker-end="url(#dm)"/>
<line x1="494" y1="150" x2="590" y2="150" stroke="#333" stroke-dasharray="2 3" opacity=".6"/>
<text x="586" y="262">h</text><text x="586" y="278" font-size="10">từ mặt móng</text><text x="586" y="291" font-size="10">đến đỉnh ray</text>
<!-- nhịp cầu trục -->
<line x1="150" y1="285" x2="490" y2="285" stroke="#333" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text x="320" y="280" text-anchor="middle">nhịp cầu trục (giữa hai trục ray)</text>
<text x="330" y="412" text-anchor="middle" font-size="11">Mặt cắt ngang nhà một nhịp có cầu trục: cột bậc, vai cột đỡ dầm cầu trục</text>
<text x="162" y="191" font-size="10">vai cột</text>
<text x="166" y="170" font-size="10">dầm cầu trục + ray</text>
</svg>
